# Mage AI training pipeline trigger
# Retrains and registers a new K-Means model daily at 02:00 UTC

schedules:
  - pipeline_uuid: train_kmeans_model_pipeline_v1
    name: daily_2am_model_retrain
    description: Re-train K-Means model and register new version in ml_models
    cron: "0 2 * * *"
    timezone: UTC
    paused: false
