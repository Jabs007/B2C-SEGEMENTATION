schedules:
  - pipeline_uuid: train_kmeans_model_pipeline_v1
    name: weekly_sunday_3am_model_retrain
    description: >
      Re-train K-Means model weekly, with 50 initializations,
      best selection by silhouette score, and automatic registration
      in ml_models with is_active=true when improved.
    cron: "0 3 * * 0"
    timezone: UTC
    paused: false
